{{- range .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .name }}
spec:
  replicas: {{ if eq .name "checkout" }}{{ $.Values.checkoutReplicas }}{{ else }}1{{ end }}
  selector:
    matchLabels: {app: {{ .name }}}
  template:
    metadata:
      labels: {app: {{ .name }}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .uid }}
        runAsGroup: {{ .uid }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: {{ .image | quote }}
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: {{ .probe }}, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          {{- if .startup }}
          startupProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 2, failureThreshold: 60}
          {{- end }}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: {{ .cpu | quote }}, memory: {{ .memory }}}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          {{- if .temporaryVolume }}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          {{- end }}
      {{- if .temporaryVolume }}
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
spec:
  selector: {app: {{ .name }}}
  type: ClusterIP
  ports: [{name: http, port: 8080, targetPort: http}]
{{- end }}
