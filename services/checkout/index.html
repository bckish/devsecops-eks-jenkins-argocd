<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Synthetic FinTech Checkout</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head>
<body><main><header><p class="eyebrow">Independent engineering portfolio</p><h1>FinTech checkout lab</h1><p>Exercise four local microservices using synthetic data only. No money moves and no messages are sent.</p></header><section><h2>Run a mock checkout</h2><form id="checkout"><label>Demo order ID <input id="order" required pattern="demo-[a-zA-Z0-9-]{1,48}" value="demo-001"></label><label>Amount (integer cents) <input id="amount" type="number" required min="1" max="100000" value="12500"></label><button>Submit synthetic checkout</button></form></section><section aria-live="polite"><h2>Service responses</h2><p id="status">Ready for a local demo.</p><pre id="result"></pre></section></main></body></html>
