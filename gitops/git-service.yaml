apiVersion: v1
kind: Namespace
metadata: {name: git-lab}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: git-server, namespace: git-lab}
spec:
  replicas: 1
  selector: {matchLabels: {app: git-server}}
  template:
    metadata: {labels: {app: git-server}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: git-server
          image: fintech-git-source:local
          imagePullPolicy: Never
          ports: [{containerPort: 8080}]
          readinessProbe: {tcpSocket: {port: 8080}, periodSeconds: 3}
---
apiVersion: v1
kind: Service
metadata: {name: git-server, namespace: git-lab}
spec:
  selector: {app: git-server}
  ports: [{port: 8080, targetPort: 8080}]
