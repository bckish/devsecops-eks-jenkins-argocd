apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fintech-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://git-server.git-lab.svc.cluster.local:8080/repo.git
    targetRevision: main
    path: chart
    helm:
      releaseName: fintech
  destination:
    server: https://kubernetes.default.svc
    namespace: fintech-gitops
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
