apiVersion: apps/v1
kind: Deployment
metadata: {name: order-api, namespace: application}
spec:
  replicas: 2
  selector: {matchLabels: {app: order-api}}
  template:
    metadata: {labels: {app: order-api}}
    spec: {containers: [{name: api, image: ghcr.io/bckish/order-api:1.0.0, ports: [{containerPort: 8080}], securityContext: {runAsNonRoot: true, allowPrivilegeEscalation: false}}]}
